[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub-clustering"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "celery[redis]>=5.3",
  "fastapi>=0.100",
  "networkx>=3.0",
  "numpy>=1.24",
  "peft>=0.10",
  "psycopg2-binary>=2.9",
  "scikit-learn>=1.3",
  "scikit-optimize>=0.9",
  "sentence-transformers>=2.6",
  "spacy>=3.7",
  "torch>=2.0",
  "transformers>=4.35",
  "uvicorn[standard]>=0.23",
]

[tool.setuptools.packages.find]
include = ["post_clustering_pipeline*"]

[project.scripts]
eventhub-api = "post_clustering_pipeline.api:run"
