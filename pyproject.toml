[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "celery[redis]>=5.3",
  "fastapi>=0.100",
  "Jinja2>=3.1",
  "networkx>=3.0",
  "numpy>=1.24",
  "peft>=0.10",
  "pgvector>=0.2",
  "psycopg2-binary>=2.9",
  "PyJWT>=2.6",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.7",
  "qrcode[pil]>=7.4",
  "requests>=2.28",
  "scikit-learn>=1.3",
  "scikit-optimize>=0.9",
  "sentence-transformers>=2.6",
  "spacy>=3.7",
  "torch>=2.0",
  "transformers>=4.35",
  "uvicorn[standard]>=0.23",
]

[tool.setuptools.packages.find]
include = ["post_clustering_pipeline*"]

[project.scripts]
nexus-api = "post_clustering_pipeline.api:run"
nexus-celery-worker = "post_clustering_pipeline.queues:worker_main"
nexus-celery-beat = "post_clustering_pipeline.queues:beat_main"
