<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Control — reset password</title>
  <link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg">
  <link rel="stylesheet" href="/admin/static/panel.css?v=19">
</head>
<body class="auth-body">
<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="bolt" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
        <path d="M34 6 L14 38 L28 38 L23 58 L50 26 L35 26 Z" fill="#ffd42a"/>
      </svg>
      <span class="auth-title">Set a new password</span>
    </div>

    {% if error %}
    <div class="alert danger" role="alert">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="/admin/reset" autocomplete="off">
      <label>New password
        <input type="password" name="password" required minlength="10" autofocus>
      </label>
      <label>Confirm new password
        <input type="password" name="confirm" required minlength="10">
      </label>
      <input type="hidden" name="token" value="{{ token }}">
      <button class="btn" type="submit">Set password</button>
    </form>
    <p class="muted small"><a href="/admin/login">Back to login</a></p>
  </div>
</main>
</body>
</html>
