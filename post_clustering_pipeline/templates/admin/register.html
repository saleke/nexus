<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Control · create owner account</title>
  <link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg">
  <link rel="stylesheet" href="/admin/static/panel.css?v=29">
</head>
<body class="auth-body">
<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="bolt" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
        <path d="M34 6 L14 38 L28 38 L23 58 L50 26 L35 26 Z" fill="#ffd42a"/>
      </svg>
      <span class="auth-title">Nexus</span>
      <span class="auth-sub">control plane</span>
    </div>

    {% if error %}
    <div class="alert danger" role="alert">{{ error }}</div>
    {% endif %}

    <p class="muted small">No owner account exists yet. Create the first one to take control of the plane.</p>
    <form class="auth-form" method="post" action="/admin/register" autocomplete="off">
      <label>Email <input type="email" name="email" required autofocus></label>
      <label>Password (min 10 chars) <input type="password" name="password" required minlength="10"></label>
      <button class="btn" type="submit">Create owner account</button>
    </form>
  </div>
</main>
</body>
</html>
